{% extends 'base.html' %}
{% block title %}Add Sender{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto bg-white rounded-lg shadow p-6">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">Add New Sender</h1>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    </div>
    {% endfor %}
    <div class="flex justify-end gap-4 pt-4">
      <a href="{% url 'sender_list' %}" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded text-sm font-medium">Cancel</a>
      <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded shadow text-sm font-medium">Save Sender</button>
    </div>
  </form>
</div>
{% endblock %}
