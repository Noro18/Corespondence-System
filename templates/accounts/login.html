<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rambat - Sistema Karta</title>
  {% load static %}
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .bg-maroon { background-color: #900000; }
    .bg-maroon-dark { background-color: #750000; }
    .bg-page { background-color: #f0f4f0; }
    .text-maroon { color: #900000; }
    .text-steel { color: #900000; }
  </style>
</head>
<body class="bg-page min-h-screen flex items-center justify-center">

  <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
    <div class="text-center mb-8">
      <img src="{% static 'images/raoea_logo.png' %}" alt="RAEOA / ZEEMS-TL Logo" class="w-28 h-28 object-contain mx-auto mb-4">
      <h1 class="text-2xl font-bold text-maroon">Sistema Jestaun Karta</h1>
      <p class="text-gray-500 mt-1">RAEOA / ZEEMS-TL</p>
    </div>

    <form method="post" class="space-y-4">
      {% csrf_token %}

      {% if form.errors %}
      <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded text-sm">
        Naran uzuáriu ka senha ladu'ak. Favor koko tan.
      </div>
      {% endif %}

      <div>
        <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Naran Uzuáriu</label>
        <input type="text" name="username" id="id_username" required
               class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-[#900000]">
      </div>

      <div>
        <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
        <input type="password" name="password" id="id_password" required
               class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-[#900000]">
      </div>

      <button type="submit"
              class="w-full bg-maroon text-white py-2 rounded hover:bg-maroon-dark font-medium">
        Rambat
      </button>

      <input type="hidden" name="next" value="{{ next }}">
    </form>

    <div class="mt-6 pt-4 border-t border-gray-200 text-center text-sm">
      <a href="{% url 'admin:index' %}" class="text-steel hover:underline">Rambat Admin</a>
    </div>
  </div>

</body>
</html>
