{% extends "base.html" %}

{% block title %}Desativa Uzuáriu - Sistema Karta{% endblock %}

{% block content %}

<div class="max-w-lg mx-auto">
  <div class="panel p-6">
    <h1 class="text-xl font-bold text-gray-800 mb-2">Desativa Uzuáriu</h1>
    <p class="text-gray-600 mb-6">
      Ó konfirma atu desativa <strong>{{ object.get_full_name|default:object.username }}</strong>?
      Ne'e sei la permite sira-nia asesu atu rambat tan.
    </p>

    <form method="post">
      {% csrf_token %}
      <div class="flex items-center gap-4">
        <button type="submit" class="bg-red-600 text-white px-6 py-2 rounded hover:bg-red-700 font-medium text-sm">Konfirma Desativa</button>
        <a href="{% url 'accounts:user_list' %}" class="text-gray-600 hover:text-gray-800 text-sm">Kansela</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
